<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlyLoong Start</title>
  <link rel="icon" href="images/home.svg" type="image/x-icon">
  <script>
  (function() {
    var theme;
    try { var val = localStorage.getItem("userPreference_theme"); if (val === "dark" || val === "light") theme = val; } catch(e) {}
    if (!theme) { theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
    if (theme === "dark") document.documentElement.classList.add("dark");
  })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="particles-bg"></div>

  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-tabs" id="navTabs"></div>
      <button id="themeToggle" class="nav-theme-toggle" title="切换主题"><i class="ri-moon-line"></i></button>
    </div>
  </nav>

  <div class="main-content">

    <div class="search-wrapper" id="search-container"></div>

    <div id="main-content-area"></div>

  </div>

  <footer>
    <p>By Loong ❤ 文明其精神 - 野蛮其体魄</p>
  </footer>

  <script type="module" src="js/nav-manager.js"></script>

</body>
</html>
