<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlyLoong Start</title>
  <link rel="icon" href="images/home.svg" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <!-- 首帧底色 + 整页淡入，必须是「内联且靠前」的：
       默认底色来自浏览器，而 main.css 是外链 —— 在它生效之前会先画一帧默认色，
       看起来就是"进页面黑一下/白一下"。这里把三套主题的底色和淡入写进文档开头，
       再由紧跟着的内联脚本在 CSS 生效前把主题定下来，从第一个字节起就是正确颜色，
       内容整体「从暗渐渐浮现」，与官网那种"先暗、再慢慢显出内容"的入场一致。
       这三行底色必须与 css/main.css 里各主题的 --bg 保持一致。 -->
  <style>
    html { background-color: #090d15; }                 /* 兜底：无 JS 或主题识别不出来 */
    html[data-theme="night"] { background-color: #090d15; }
    html[data-theme="day"]   { background-color: #f4f6f9; }
    html[data-theme="flow"]  { background-color: #0e1219; }
    body {
      margin: 0;
      animation: bootFade 1.5s ease-in-out both;
    }
    @keyframes bootFade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
  <!-- 主题必须在首帧之前定下来，否则会「先按默认色画一帧、再跳成主题色」。
       这段不能写成模块（模块是异步的，等它跑完首帧早画完了），
       所以存储键在这里是硬编码的 —— 必须与 js/modules/theme.js 里的 STORAGE_KEY 一致。 -->
  <script>
    (function () {
      var KNOWN = { night: 1, day: 1, flow: 1 };
      var id = 'night';
      try {
        id = localStorage.getItem('flyloong_theme') || 'night';
      } catch (e) {
        /* 隐私模式读不了 localStorage：直接用默认主题 */
      }
      document.documentElement.setAttribute('data-theme', KNOWN[id] ? id : 'night');
    })();
  </script>
</head>
<body>

  <!-- 流动背景：hero 光带（WebGL）+ 交互网格 -->
  <div id="hero-shader" aria-hidden="true"></div>
  <div id="deep-bg">
    <div class="deep-bg-grid"></div>
  </div>

  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-tabs" id="navTabs"></div>
      <!-- 主题切换（右上角，绝对定位，不挤动居中的 .nav-tabs）-->
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题" title="切换主题">
        <i class="ri-moon-line" aria-hidden="true"></i>
      </button>
    </div>
  </nav>

  <div class="main-content">
    <div class="search-wrapper" id="search-container"></div>
    <div id="main-content-area"></div>
  </div>

  <footer>
    <p><a href="https://github.com/zfloong/zfloong.github.io" target="_blank" rel="noopener noreferrer">LoongStart</a> · 文明其精神 野蛮其体魄</p>
    <button id="edit-entry" class="edit-entry" type="button" aria-haspopup="dialog">
      <i class="ri-settings-3-line" aria-hidden="true"></i><span>编辑</span>
    </button>
  </footer>

  <script type="module" src="js/nav-manager.js"></script>

</body>
</html>
